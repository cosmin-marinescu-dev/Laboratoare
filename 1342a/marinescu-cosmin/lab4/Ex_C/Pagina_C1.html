table {
    border-collapse: collapse;
    width: 100%;
}

/* Chenare verzi și spațiu generos pentru toate celulele */
th, td {
    border: 2px solid green;
    padding: 10px 15px;
}

/* Titlul tabelului (caption) */
caption {
    background-color: orange;
    color: white;
    font-size: 20px;
    font-weight: bold;
    padding: 8px;
}

/* Antetul tabelului */
th {
    background-color: magenta;
    color: black;
}

/* Toate celulele din corp - fond portocaliu */
td {
    background-color: orange;
}

/* Celulele cu numele echipelor (Munte / Mare) - fond magenta, îngroșate și centrate */
td[rowspan] {
    background-color: magenta;
    font-weight: bold;
    text-align: center;
}
</style>
</head>
<body>

<h1 id="hd">Tabel special</h1>
<p>Un tabel cu "celule lipite"
</p> 
<table style="width:100%">
<caption>Echipe si hobby-uri</caption>
  <tr>
    <th>Echipa</th>
	<th>Nume</th>
    <th colspan="2">Pasiuni</th>
  </tr>
  <tr>
	<td rowspan="3">Munte</td>
    <td>Popescu</td>
    <td>calatorii</td>
    <td>filatelie</td>
  </tr>
  <tr>
	
    <td>Ionescu</td>
    <td>planorism</td>
    <td>sah</td>
  </tr>
  <tr>
    <td>Vasilescu</td>
    <td>fotbal</td>
    <td>lectura</td>
</tr>
  <tr>
	<td rowspan="4">Mare</td>
    <td>Georgescu</td>
    <td>plaja</td>
    <td>dans</td>
  </tr>
  <tr>
	
    <td>Gigescu</td>
    <td>surf</td>
    <td>samba</td>
  </tr>
  <tr>
    <td>Marinescu</td>
    <td>muzica</td>
    <td>inot</td>
</tr>
  <tr>
	
    <td>Mintescu</td>
    <td>politica</td>
    <td>delicateturi</td>
  </tr>
</table>
