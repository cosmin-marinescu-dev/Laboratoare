<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_B1</title>
<style>
    body {
    background-color: #ffffcc;
    }
.center {
  text-align: center;
  color: white;
}
    h1 {
        background-color: #00cc66;
        color: orange;
    }
table, th, td {
    border: 1px solid black;
    padding: 8px;
}
/*
.centre {
border: 5px solid blue;
 padding: 15px;
}*/
#s1 table {
    background-color: blue;
}
#s2 table {
background-color: yellow;
}
div {
color:blue;
}
</style>
</head>
<body>

<h1 class="center">Tabele formatate</h1>
<div id="s1">
<table style="width:100%" class="center">
  <tr>
    <th>Firstname</th>
    <th>Lastname</th>
    <th>Age</th>
  </tr>
  <tr>
    <td>Jill</td>
    <td>Smith</td>
    <td>50</td>
  </tr>
  <tr>
    <td>Eve</td>
    <td>Jackson</td>
    <td>94</td>
  </tr>
</table>
<br>
</div> 
<div id="s2" style="width:50%">
<br>
<table style="width:100%" class="centre">
  <tr>
    <th class="centre">Firstname</th>
    <th class="centre">Lastname</th>
    <th class="centre">Age</th>
  </tr>
  <tr>
    <td class="centre">Jill</td>
    <td>Smith</td>
    <td>50</td>
  </tr>
  <tr>
    <td class="centre">Eve</td>
    <td>Jackson</td>
    <td>94</td>
  </tr>
</table>
</div> 


</body>
</html>

<!-- 
1. Cele două tabele au fundaluri diferite deoarece sunt transparente. 
Primul tabel preia fundalul verde al div-ului cu id="s1", 
iar al doilea tabel preia fundalul galben al div-ului cu id="s2".

2. Celulele celui de-al doilea tabel arătau diferit între ele deoarece unele aveau 
clasa .centre (chenar albastru de 5px și padding de 15px), iar altele erau celule standard.
-->
