<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Exercitiul 3</title>
</head>
<body>
    <h1>Modificarea paragrafelor</h1>

    <button id="buton">Schimba textele</button>

    <p id="p1" style="color: blue; font-weight: bold;">
        Acesta este primul paragraf.
    </p>

    <p id="p2" style="color: red; background-color: yellow;">
        Acesta este al doilea paragraf.
    </p>

    <script>
        var p1 = document.getElementById("p1");
        var p2 = document.getElementById("p2");

        p1.onclick = function() {
            var text = prompt("Introduceti textul nou:", this.textContent);

            if (text !== null) {
                this.textContent = text;
            }
        };

        p2.onclick = function() {
            var text = prompt("Introduceti textul nou:", this.textContent);

            if (text !== null) {
                this.textContent = text;
            }
        };

        document.getElementById("buton").onclick = function() {
            var temporar = p1.textContent;

            p1.textContent = p2.textContent;
            p2.textContent = temporar;
        };
    </script>
</body>
</html>
