
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Exercitiu bonus - Galerie</title>
</head>
<body>
    <h1>Galerie de imagini</h1>

    <img id="imagine" src="Img/pisici.jpg"
         alt="Imagine din galerie" width="400">

    <p id="numar">Imaginea 1 din 4</p>

    <button id="inapoi">Inapoi</button>
    <button id="inainte">Inainte</button>

    <script>
        var imagini = [
            "Img/pisici.jpg",
            "Img/caini.jpg",
            "Img/munti.jpg",
            "Img/mare.jpg"
        ];

        var pozitie = 0;

        function afiseazaImaginea() {
            document.getElementById("imagine").src =
                imagini[pozitie];

            document.getElementById("numar").textContent =
                "Imaginea " + (pozitie + 1) +
                " din " + imagini.length;
        }

        document.getElementById("inainte").onclick = function() {
            pozitie = (pozitie + 1) % imagini.length;
            afiseazaImaginea();
        };

        document.getElementById("inapoi").onclick = function() {
            pozitie = (pozitie - 1 + imagini.length)
                       % imagini.length;
            afiseazaImaginea();
        };
    </script>
</body>
</html>
