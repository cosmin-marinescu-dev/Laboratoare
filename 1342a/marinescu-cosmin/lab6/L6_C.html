
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Exercitiul 4</title>
</head>
<body>
    <h1 id="titlu">Modificarea culorilor cu JavaScript</h1>

    <p id="paragraf">
        Aceasta este prima linie.<br>
        Aceasta este a doua linie.<br>
        Aceasta este a treia linie.
    </p>

    <script>
        var titlu = document.getElementById("titlu");
        var paragraf = document.getElementById("paragraf");

        titlu.onclick = function() {
            var culoare = prompt("Introduceti culoarea textului:");

            if (culoare !== null) {
                culoare = culoare.trim();

                if (CSS.supports("color", culoare)) {
                    this.style.color = culoare;
                } else {
                    alert("Culoarea introdusa nu este valida!");
                }
            }
        };

        paragraf.onclick = function() {
            var culoare = prompt("Introduceti culoarea fundalului:");

            if (culoare !== null) {
                culoare = culoare.trim();

                if (CSS.supports("color", culoare)) {
                    this.style.backgroundColor = culoare;
                } else {
                    alert("Culoarea introdusa nu este valida!");
                }
            }
        };
    </script>
</body>
</html>
